# =============================================================================
# Jenkins CI/CD environment: Jenkins controller + Docker-in-Docker (DinD)
#
# Start:  docker compose up -d --build
# Stop:   docker compose down          (named volumes, and so all data, are kept)
# Access: Jenkins is bound to 127.0.0.1 only. From your workstation, run
#         ssh -L 8080:localhost:8080 <user>@<server>  and browse to http://localhost:8080
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # docker: Docker-in-Docker daemon
  # Jenkins sends every docker command (agent containers, image builds, pushes)
  # to this daemon over mutual TLS. The host's /var/run/docker.sock is never
  # mounted into Jenkins, so a compromised pipeline cannot control the host's
  # Docker engine.
  # ---------------------------------------------------------------------------
  docker:
    image: docker:dind
    container_name: jenkins-docker
    # DinD needs privileged mode to run a nested Docker daemon. Only this
    # container gets it; the Jenkins controller runs unprivileged.
    privileged: true
    restart: unless-stopped
    environment:
      # Makes dind generate a CA plus server/client certificates under /certs,
      # so the Docker API listens only on 2376 with TLS (never on plain 2375).
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      # Client certificates generated by dind, shared read-only with Jenkins.
      - jenkins-docker-certs:/certs/client
      # Jenkins home mounted at the SAME path as in the Jenkins container. When
      # the pipeline starts the node:16 agent with "docker run -v <workspace>",
      # the path is resolved on this daemon, so the workspace has to exist here too.
      - jenkins-data:/var/jenkins_home
      # Image layers and build cache persist across restarts (faster builds).
      - docker-cache:/var/lib/docker
    networks:
      jenkins:
        aliases:
          - docker          # hostname Jenkins uses in DOCKER_HOST
    # No "ports:" entry on purpose: the Docker API is reachable only
    # from inside the private "jenkins" network, never from the host/Internet.

  # ---------------------------------------------------------------------------
  # jenkins: Jenkins controller (custom image, see ./jenkins/Dockerfile)
  # Runs as the unprivileged "jenkins" user (UID 1000). Security settings
  # (users, permissions, CSRF, build authorization) come from casc.yaml.
  # ---------------------------------------------------------------------------
  jenkins:
    build: ./jenkins
    image: local/jenkins-hardened:lts
    container_name: jenkins
    restart: unless-stopped
    depends_on:
      - docker
    environment:
      # Point the docker CLI inside Jenkins at the DinD daemon.
      DOCKER_HOST: tcp://docker:2376
      # Where the TLS client certificates (ca.pem, cert.pem, key.pem) are.
      DOCKER_CERT_PATH: /certs/client
      # Require TLS and verify the daemon's certificate (mutual TLS).
      DOCKER_TLS_VERIFY: "1"
      # Skip the interactive setup wizard; JCasC creates the admin user instead.
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      # Location of the Configuration-as-Code file baked into the image.
      CASC_JENKINS_CONFIG: /var/jenkins_conf/casc.yaml
    # Passwords are Docker secrets (files under /run/secrets), not plain
    # environment variables, so they don't show up in "docker inspect".
    secrets:
      - jenkins_admin_password
      - ci_runner_password
    volumes:
      # Persists jobs, build history, logs, archived artifacts and plugins.
      - jenkins-data:/var/jenkins_home
      # TLS client certificates for talking to DinD (read-only).
      - jenkins-docker-certs:/certs/client:ro
    ports:
      # Web UI bound to the loopback interface only; use an SSH tunnel or a
      # TLS reverse proxy to reach it. Port 50000 (inbound agents) is
      # deliberately NOT published because no external agents are used.
      - "127.0.0.1:8080:8080"
    networks:
      - jenkins

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  # Private bridge network: only Jenkins and DinD are attached to it.
  jenkins:
    driver: bridge

# -----------------------------------------------------------------------------
# Named volumes (persistent storage)
# -----------------------------------------------------------------------------
volumes:
  jenkins-data:          # JENKINS_HOME: jobs, logs, artifacts, plugins, config
  jenkins-docker-certs:  # TLS client certs generated by DinD
  docker-cache:          # DinD image/layer storage (build cache)

# -----------------------------------------------------------------------------
# Secrets: files are created locally and are git-ignored (see README.md)
# -----------------------------------------------------------------------------
secrets:
  jenkins_admin_password:
    file: ./secrets/jenkins_admin_password.txt
  ci_runner_password:
    file: ./secrets/ci_runner_password.txt
